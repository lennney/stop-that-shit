name: Overengineering Bad Case
description: Share a real agent action that went beyond the task.
title: "[Overengineering Case] "
labels: ["case:bad"]
body:
  - type: markdown
    attributes:
      value: |
        Share one concrete action the agent took that the task did not require. Cases from before or after installing Stop That Shit are both useful.

        Do not include secrets, private code, account data, or full transcripts. A small sanitized excerpt is enough.
  - type: textarea
    id: request
    attributes:
      label: What did you ask the agent to do?
      description: Paste the exact sanitized request if possible. Include review/change/answer/monitor mode if you set one.
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: What did the agent do beyond the task?
      description: Name one material action, such as editing during review, changing adjacent files, adding a dependency, or building unused infrastructure.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Why was that action unnecessary?
      description: Point to the request, diff, test, runtime behavior, or other fact that shows where the agent should have stopped. Then state the smaller acceptable outcome.
    validations:
      required: true
  - type: dropdown
    id: sts_state
    attributes:
      label: Stop That Shit state
      options:
        - Not installed
        - Installed but not invoked explicitly
        - Invoked in review mode
        - Invoked in change mode
        - Invoked in answer or monitor mode
        - Unsure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host name (Codex, Claude Code, OpenCode, Hermes, Pi, or OMP), surface, version, model, reasoning level, operating system, and plugin revision if installed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal public reproduction
      description: Add a sanitized repository, fixture, exact task, or before/after diff if it is safe to share. Without a reproduction, the report can guide research but cannot support an effectiveness claim.
  - type: textarea
    id: recurrence
    attributes:
      label: Did it happen more than once?
      description: If you retried the same task, say how many times and what changed. One occurrence is still useful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I sanitized private and identifying information.
          required: true
